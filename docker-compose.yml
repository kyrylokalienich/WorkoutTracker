services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: workouttracker
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d workouttracker"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./src/WorkoutTracker.Backend
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:5000
      ConnectionStrings__DefaultConnection: "Host=db;Port=5432;Database=workouttracker;Username=postgres;Password=postgres"
      Jwt__SecretKey: "change-this-secret-to-something-random-at-least-32-characters"
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy

  # Local-dev only: runs `next dev` with hot-reload (the production frontend is a
  # static export on S3 + CloudFront, so there is no frontend image to build).
  # The browser calls the API directly, so NEXT_PUBLIC_API_URL points at the
  # published API port on the host (localhost:5000), not the internal api:5000.
  frontend:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- -H 0.0.0.0"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:5000
      WATCHPACK_POLLING: "true"   # reliable file watching for bind mounts (esp. on Windows)
    volumes:
      - ./src/WorkoutTracker.Frontend:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  postgres_data:
