services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: workouttracker
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d workouttracker"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./src/WorkoutTracker.Backend
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:5000
      ConnectionStrings__DefaultConnection: "Host=db;Port=5432;Database=workouttracker;Username=postgres;Password=postgres"
      Jwt__SecretKey: "change-this-secret-to-something-random-at-least-32-characters"
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./src/WorkoutTracker.Frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://api:5000
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  postgres_data:
