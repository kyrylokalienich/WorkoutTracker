name: Deploy to AWS

on:
  push:
    branches: [main]
  workflow_dispatch: {}   # allows manual runs from the Actions tab

env:
  AWS_REGION: eu-central-1
  ECR_API_REPO: workouttracker-api
  # Frontend (static) deploy targets — not secret, safe to keep in the repo.
  NEXT_PUBLIC_API_URL: https://workouttracker-api-kk.duckdns.org
  S3_FRONTEND_BUCKET: workouttracker-frontend-kk-2026
  CLOUDFRONT_DISTRIBUTION_ID: E2IJZYMDR1QJCO

permissions:
  id-token: write   # required to request the OIDC token for AWS
  contents: read

jobs:
  # ── Backend: build API image, push to ECR, roll out on EC2 via SSM ───────────
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Exchanges the GitHub OIDC token for short-lived AWS creds — no stored AWS keys.
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build & push API image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          docker build \
            -f src/WorkoutTracker.Backend/Dockerfile \
            -t "$REGISTRY/$ECR_API_REPO:${{ github.sha }}" \
            -t "$REGISTRY/$ECR_API_REPO:latest" \
            src/WorkoutTracker.Backend
          docker push "$REGISTRY/$ECR_API_REPO:${{ github.sha }}"
          docker push "$REGISTRY/$ECR_API_REPO:latest"

      # Tells the EC2 instance to pull the new image and restart the stack.
      # The API container applies EF Core migrations itself on startup (AppDbInitializer).
      - name: Deploy to EC2 via SSM
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
        run: |
          CMD_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy ${{ github.sha }}" \
            --parameters "commands=/opt/workouttracker/deploy.sh ${{ github.sha }} $REGISTRY $AWS_REGION" \
            --query "Command.CommandId" --output text)
          echo "SSM command: $CMD_ID"

          aws ssm wait command-executed \
            --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" || true

          echo "----- remote stdout -----"
          aws ssm get-command-invocation \
            --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
            --query "StandardOutputContent" --output text
          echo "----- remote stderr -----"
          aws ssm get-command-invocation \
            --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
            --query "StandardErrorContent" --output text

          STATUS=$(aws ssm get-command-invocation \
            --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
            --query "Status" --output text)
          echo "Deploy status: $STATUS"
          [ "$STATUS" = "Success" ]

  # ── Frontend: build static export, sync to S3, invalidate CloudFront ─────────
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: src/WorkoutTracker.Frontend/package-lock.json

      - name: Build static site
        working-directory: src/WorkoutTracker.Frontend
        run: |
          npm ci
          npm run build   # NEXT_PUBLIC_API_URL is read from the workflow env

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Sync to S3
        run: aws s3 sync src/WorkoutTracker.Frontend/out/ "s3://$S3_FRONTEND_BUCKET/" --delete

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "$CLOUDFRONT_DISTRIBUTION_ID" \
            --paths "/*"
