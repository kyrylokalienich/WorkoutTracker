name: Deploy to AWS

on:
  push:
    branches: [main]
  workflow_dispatch: {}   # allows manual runs from the Actions tab

env:
  AWS_REGION: eu-central-1
  ECR_API_REPO: workouttracker-api
  ECR_FRONTEND_REPO: workouttracker-frontend

permissions:
  id-token: write   # required to request the OIDC token for AWS
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Exchanges the GitHub OIDC token for short-lived AWS creds — no stored AWS keys.
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build & push API image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          docker build \
            -f src/WorkoutTracker.Backend/Dockerfile \
            -t "$REGISTRY/$ECR_API_REPO:${{ github.sha }}" \
            -t "$REGISTRY/$ECR_API_REPO:latest" \
            src/WorkoutTracker.Backend
          docker push "$REGISTRY/$ECR_API_REPO:${{ github.sha }}"
          docker push "$REGISTRY/$ECR_API_REPO:latest"

      - name: Build & push frontend image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          docker build \
            -f src/WorkoutTracker.Frontend/Dockerfile \
            --build-arg NEXT_PUBLIC_API_URL=http://api:5000 \
            -t "$REGISTRY/$ECR_FRONTEND_REPO:${{ github.sha }}" \
            -t "$REGISTRY/$ECR_FRONTEND_REPO:latest" \
            src/WorkoutTracker.Frontend
          docker push "$REGISTRY/$ECR_FRONTEND_REPO:${{ github.sha }}"
          docker push "$REGISTRY/$ECR_FRONTEND_REPO:latest"

      # Tells the EC2 instance to pull the new images and restart the stack.
      # The API container applies EF Core migrations itself on startup (AppDbInitializer).
      - name: Deploy to EC2 via SSM
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
        run: |
          CMD_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy ${{ github.sha }}" \
            --parameters "commands=/opt/workouttracker/deploy.sh ${{ github.sha }} $REGISTRY $AWS_REGION" \
            --query "Command.CommandId" --output text)
          echo "SSM command: $CMD_ID"

          aws ssm wait command-executed \
            --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" || true

          echo "----- remote stdout -----"
          aws ssm get-command-invocation \
            --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
            --query "StandardOutputContent" --output text
          echo "----- remote stderr -----"
          aws ssm get-command-invocation \
            --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
            --query "StandardErrorContent" --output text

          STATUS=$(aws ssm get-command-invocation \
            --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
            --query "Status" --output text)
          echo "Deploy status: $STATUS"
          [ "$STATUS" = "Success" ]
